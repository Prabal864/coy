[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["data/profiles.json"]

[[redirects]]
  from = "/feed"
  to = "/.netlify/functions/feed"
  status = 200

[[redirects]]
  from = "/swipe"
  to = "/.netlify/functions/swipe"
  status = 200

[[redirects]]
  from = "/matches"
  to = "/.netlify/functions/matches"
  status = 200

[[redirects]]
  from = "/reset"
  to = "/.netlify/functions/reset"
  status = 200
